name: Model 665 draft-copy focused qualification

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-copy-policy.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-copy-policy.spec.ts
      - .github/workflows/model-665-draft-copy-focused.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Original-line audit, strict TS and focused Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Static model and provenance boundaries
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
          node scripts/audit-summary-model-original-files.mjs
      - name: Publication-copy negative and normalization regressions
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/openai-responses-reader-summary-draft-copy-policy.spec.ts \
            libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts
