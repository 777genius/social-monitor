# Temporary PR #665 synthetic schema parity proof. Remove after executing.
name: Model reader content schema focused Jest draft

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-reader-schema-focused-jest-draft.yml

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

jobs:
  reader_schema_regressions:
    name: Reader schema, content and OpenAI adapter Jest (no paid calls)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Run focused schema and adapter tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/openai-responses-reader-summary-json-schema.spec.ts libs/summary/adapters/model/openai-responses-reader-summary-content-support.spec.ts libs/summary/adapters/model/openai-responses-reader-summary-model.adapter.spec.ts
