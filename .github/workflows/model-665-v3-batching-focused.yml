# Temporary scoped verification for existing Draft PR #665; never a Ready gate.
name: Model 665 V3 presentation batching focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-v3-batching-focused.yml
      - libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-batching.ts
      - libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-batching.spec.ts
      - libs/summary/adapters/model/agent-runtime-promotion-presentation-v3.builder.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact source and pinned original
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked dependencies and Prisma
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Frozen source audit and architecture quality
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Provider batch, V3 integration and failure regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-batching.spec.ts
          libs/summary/adapters/model/agent-runtime-promotion-presentation-v3.builder.spec.ts
          libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-execution.spec.ts
          libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-task-command.spec.ts
