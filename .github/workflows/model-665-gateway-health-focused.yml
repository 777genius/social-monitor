# Temporary exact-code gate for the gateway health ownership slice in Draft #665.
name: PR 665 gateway health focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-gateway-health-focused.yml
      - libs/summary/adapters/model/gateway-llm/gateway-llm-health*
      - libs/summary/adapters/model/gateway-llm/gateway-llm-client.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node 22 and cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked installation and Prisma
        run: |
          npm ci
          npm run prisma:generate
      - name: Strict TypeScript, architecture, quality, 1000LOC and runtime safety
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Gateway health and full client regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/gateway-llm/gateway-llm-health.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-account-selector.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-dispatch-retry-policy.spec.ts
