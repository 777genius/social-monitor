name: PR665 model topic priority focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

jobs:
  model_topic_priority:
    name: Topic priority and pinned original audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout complete pinned source history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked install and Prisma
        run: |
          npm ci
          npm run prisma:generate
      - name: Audit original code and architectural boundaries
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git cat-file -e 3fa1b9e9ee5bd1302840d1164a975cde3f0eeaba^{commit}
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Focused topic priority and cohort coverage Jest
        run: |
          npx jest --config jest.config.ts --runInBand --runTestsByPath             libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-priority.spec.ts             libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-coverage.spec.ts
