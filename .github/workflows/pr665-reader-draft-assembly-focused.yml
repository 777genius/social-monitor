name: PR 665 focused reader draft assembly

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/pr665-reader-draft-assembly-focused.yml
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-assembly.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-reader-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/social_monitor_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Architecture boundaries
        run: npm run check:architecture
      - name: Strict source cap
        run: npm run check:source-line-cap
      - name: Reader draft normalization and HTTP regressions
        run: npx jest --runInBand libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts libs/summary/adapters/model/openai-responses-reader-summary-model.adapter.spec.ts
