# Temporary branch-scoped strict qualification of one bounded Draft #665 refactor.
name: Model 665 deterministic coverage focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-deterministic-coverage-focused.yml
      - libs/summary/adapters/model/deterministic-reader-summary-model.adapter.ts
      - libs/summary/adapters/model/deterministic-reader-summary-coverage-selection.ts
      - libs/summary/adapters/model/deterministic-reader-summary-model.adapter.spec.ts
      - libs/summary/adapters/model/deterministic-reader-summary-outcome-policy.ts
      - libs/summary/adapters/model/deterministic-reader-summary-outcome-policy.spec.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact branch commit with frozen original Git history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked dependencies and generated Prisma
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Frozen original lineage and strict architecture
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Deterministic reader-summary regression tests
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/deterministic-reader-summary-model.adapter.spec.ts
          libs/summary/adapters/model/deterministic-reader-summary-evidence-selection.spec.ts
          libs/summary/adapters/model/deterministic-reader-summary-outcome-policy.spec.ts
