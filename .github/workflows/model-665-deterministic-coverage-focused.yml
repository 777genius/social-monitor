      - libs/summary/adapters/model/reader-summary-token-budget.ts
      - libs/summary/adapters/model/summary-model-budget-admission.ts
      - libs/summary/adapters/model/summary-model-budget-admission.spec.ts
      - libs/summary/adapters/model/deterministic-reader-summary-citation-selection.ts
      - libs/summary/adapters/model/deterministic-reader-summary-provider-citation-policy.ts
      - libs/summary/adapters/model/deterministic-reader-summary-provider-citation-policy.spec.ts
      - libs/summary/adapters/model/deterministic-reader-summary-narrative.ts
      - libs/summary/adapters/model/deterministic-reader-summary-secondary-sections.ts
      - libs/summary/adapters/model/deterministic-reader-summary-lead-section.ts
      - libs/summary/adapters/model/deterministic-reader-summary-narrative.spec.ts
