name: Draft model frozen evidence boundary check

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-draft-evidence-binding-check.yml

permissions:
  contents: read

jobs:
  model_focused:
    name: Frozen daily editorial boundary Jest and TS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and tests
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate pinned Prisma client
        run: npm run prisma:generate
      - name: Verify TypeScript, Clean Architecture and hard 1000 LOC
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
      - name: Verify frozen binding and complete daily digest regression
        run: |
          set -euo pipefail
          ./node_modules/.bin/jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/reader-summary-daily-editorial-evidence-binding.spec.ts \
            libs/summary/adapters/model/reader-summary-daily-digest.spec.ts
