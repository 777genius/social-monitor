permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify strict types and architectural hard gates
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Verify prompt policy and provider request/response parity
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/openai-responses-reader-summary-legacy-instructions.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-prompt-contract.spec.ts
          libs/summary/adapters/model/openai-responses-summary-prompt.spec.ts
          libs/summary/adapters/model/openai-responses-summary-model.adapter.spec.ts
          libs/summary/adapters/model/openai-responses-summary-transport.spec.ts
          libs/summary/adapters/model/openai-responses-summary-provider-citation-decoder.spec.ts
          libs/summary/adapters/model/openai-responses-summary-citations.spec.ts
          libs/summary/adapters/model/openai-responses-summary-draft-shape.spec.ts
          libs/summary/adapters/model/openai-responses-summary-quality.spec.ts
          libs/summary/adapters/model/openai-responses-summary-json-boundaries.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-item-normalization.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-content-items.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-content-support.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-content-quality.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-content-quality-boundaries.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-response-parser.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-model.adapter.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-route-admission.spec.ts
          libs/summary/adapters/model/openai-promotion-presentation-v3.builder.spec.ts
          libs/summary/adapters/model/openai-promotion-presentation-v3-boundaries.spec.ts
