# Temporary exact-HEAD provenance check for the existing Draft #665.
name: PR 665 pinned original-source audit
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-provenance-focused.yml
      - scripts/audit-summary-model-original-files.mjs
      - docs/iterations/2026-11-08-summary-model-adapters-10k-inventory.md
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact HEAD with pinned main history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Audit baseline and changed-original eligibility
        run: |
          node --check scripts/audit-summary-model-original-files.mjs
          node scripts/audit-summary-model-original-files.mjs
