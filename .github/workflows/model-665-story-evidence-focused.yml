permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout immutable SHA and pinned original
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked install and Prisma generate
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Strict source provenance, TS and architecture quality checks
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Story evidence, prompt/schema and adapter Jest regression
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/agent-runtime-reader-summary-story-evidence-prompt.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-story-normalizer.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-story-cluster-admission.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-evidence-relations.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-validation.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-section-admission.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-provider-section.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-editorial-copy-policy.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-editorial-admission.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-title-policy.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-evidence.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-coverage.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-contracts.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-verifier.adapter.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-options-boundary.spec.ts
          libs/summary/adapters/model/story-relation-response-schema.spec.ts
          libs/summary/adapters/model/reader-summary-narrative-repair-contract.spec.ts
