# Branch-scoped synthetic trust boundary check for existing Draft PR #665; not 20/20 Ready.
name: Model 665 story evidence binding focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-story-evidence-focused.yml
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
      - libs/summary/adapters/model/openai-responses-reader-summary-story-citations.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-cluster-citations.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-citation-coverage.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-story-fallback.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-story-fallback-evidence.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-story-fallback-slate.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-story-fallback-coverage.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-story-normalizer.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-story-evidence-prompt.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-verifier-prompt.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-identity.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-command.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-verifier.adapter.spec.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout immutable SHA and pinned original
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked install and Prisma generate
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Strict source provenance, TS and architecture quality checks
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Story evidence, prompt/schema and adapter Jest regression
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/agent-runtime-reader-summary-story-evidence-prompt.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-story-normalizer.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-contracts.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-verifier.adapter.spec.ts
