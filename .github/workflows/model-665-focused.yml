# Temporary exact-code focused contract check for PR #665; delete after success.
name: PR665 reader summary trust split
on:
  push:
    branches: [refactor/summary-model-adapters-10k-20261108]
    paths: [.github/workflows/model-665-focused.yml]
permissions:
  contents: read
jobs:
  reader_summary_trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Architecture and hard line cap
        run: |
          npm run check:architecture
          npm run check:source-line-cap
      - name: Focused Jest trust regressions
        run: |
          npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/agent-runtime-reader-summary-response-validation.spec.ts libs/summary/adapters/model/agent-runtime-reader-summary-model.adapter.spec.ts libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts
