# Temporary, non-deploy, exact-HEAD focused qualification for Draft PR #665.
# Remove only after collecting the completed result. Do not modify canonical CI.
name: Model 665 focused contracts
on:
  push:
    branches: [refactor/summary-model-adapters-10k-20261108]
    paths:
      - .github/workflows/model-665-focused.yml
permissions:
  contents: read
jobs:
  presentation_contracts:
    name: Presentation options and topic-labeler focused Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Strict architecture and source caps
        run: |
          npm run check:architecture
          npm run check:source-line-cap
      - name: Focused model regression suites
        run: |
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/agent-runtime-promotion-presentation-v3-options.spec.ts \
            libs/summary/adapters/model/agent-runtime-promotion-presentation-v3.builder.spec.ts \
            libs/summary/adapters/model/agent-runtime-reader-summary-topic-labeler-policy.spec.ts \
            libs/summary/adapters/model/agent-runtime-reader-summary-topic-labeler-prompt.spec.ts \
            libs/summary/adapters/model/agent-runtime-reader-summary-topic-labeler.adapter.spec.ts
