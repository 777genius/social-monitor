# Temporary exact-code focused qualification for PR #665, remove after passing.
name: PR665 weekly runtime responsibility split
on:
  push:
    branches: [refactor/summary-model-adapters-10k-20261108]
    paths: [.github/workflows/model-665-focused.yml]
permissions:
  contents: read
jobs:
  weekly_runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - run: npm run check:architecture && npm run check:source-line-cap
      - run: npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/openai-responses-reader-summary-weekly-options.spec.ts libs/summary/adapters/model/openai-responses-reader-summary-weekly-model.adapter.spec.ts
