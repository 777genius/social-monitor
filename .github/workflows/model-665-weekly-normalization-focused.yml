# Temporary Draft #665 exact-source focused job; remove after terminal PASS.
name: Model 665 weekly and narrative trace focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-weekly-normalization-focused.yml
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-legacy-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-expanded-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-legacy-normalization.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-narrative.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-narrative-evidence.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-narrative-markdown.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-narrative-validation.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-narrative-section-projection.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA and immutable baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify TS, architecture, quality, runtime and original provenance
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
          node scripts/audit-summary-model-original-files.mjs
      - name: Run strict weekly normalization, parser and narrative Jest regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-legacy-normalization.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-parser.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-evidence.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-narrative-validation.spec.ts
