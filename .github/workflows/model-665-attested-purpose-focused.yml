# Temporary exact-code test on existing Draft #665; not a deployment or Ready CI substitute.
# Requalify 1329 frozen original positions plus gateway/model/legacy recovery and attestation checks.
name: Model 665 gateway and attested purpose focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-attested-purpose-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact HEAD and pinned original
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked installation and Prisma
        run: |
          npm ci
          npm run prisma:generate
      - name: Frozen origin and strict architecture
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Gateway identity, purpose admission and MiMo regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/reader-summary-attested-purpose-policy.spec.ts
          libs/summary/adapters/model/reader-summary-execution-identity-policy.spec.ts
          libs/summary/adapters/model/reader-summary-mimo-attestation.spec.ts
          libs/summary/adapters/model/reader-summary-gateway-route-policy.spec.ts
          libs/summary/adapters/model/reader-summary-generation-identity-policy.spec.ts
