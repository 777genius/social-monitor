name: Summary model gateway dispatch replay focused qualification
on:
  push:
    branches: [refactor/summary-model-adapters-10k-20261108]
    paths:
      - .github/workflows/summary-model-gateway-retry-focus-20261113.yml
      - libs/summary/adapters/model/gateway-llm/gateway-llm-dispatch-retry-policy.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-dispatch-retry-policy.spec.ts
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate locked Prisma client (no migrations)
        run: npm run prisma:generate
      - name: Fetch frozen 2026-11-08 original source commit
        run: git fetch --no-tags --depth=1 origin 3fa1b9e9ee5bd1302840d1164a975cde3f0eeaba
      - name: Strict TypeScript, frozen original provenance and source boundary guards
        run: |
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Gateway dispatch replay and adjacent gateway regressions
        run: |
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/gateway-llm/gateway-llm-dispatch-retry-policy.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts \
            libs/summary/adapters/model/openai-responses-reader-summary-adaptive-evidence.spec.ts \
            libs/summary/adapters/model/openai-responses-reader-summary-source-content.spec.ts
