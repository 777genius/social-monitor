# Temporary branch-local focused qualification for existing Draft PR #665 only.
# Not a substitute for exact-final-HEAD Ready 20/20 or independent reviews.
name: Model 665 gateway structured output focused
on:
  push:
    branches: [refactor/summary-model-adapters-10k-20261108]
    paths:
      - .github/workflows/model-665-gateway-structured-output-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA and pinned original
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and generate Prisma
        run: |
          npm ci
          npm run prisma:generate
      - name: Audit frozen coordinates and static contracts
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Verify gateway strict output and existing client contracts
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/gateway-llm/gateway-llm-structured-output.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-output-schema.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts
