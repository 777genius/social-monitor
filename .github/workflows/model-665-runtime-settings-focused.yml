name: Model 665 runtime settings focused verification

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-runtime-settings-focused.yml

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

jobs:
  focused:
    name: OpenAI summary settings + adapter regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and generate Prisma client
        run: |
          npm ci --prefer-offline --no-audit
          npm run prisma:generate
      - name: Validate TypeScript, architecture and 1000 LOC cap
        run: |
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
      - name: Execute exact adapter and settings regressions
        run: |
          npx jest --runInBand libs/summary/adapters/model/openai-responses-summary-runtime-settings.spec.ts libs/summary/adapters/model/openai-responses-summary-model.adapter.spec.ts
