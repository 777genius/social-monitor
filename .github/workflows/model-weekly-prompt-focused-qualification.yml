# Temporary, isolated synthetic contract regression; no paid model call.
# Delete after evidence is recorded; do not alter canonical PR checks.
name: Model weekly prompt focused synthetic qualification

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-weekly-prompt-focused-qualification.yml

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

jobs:
  weekly_prompt:
    name: Weekly sealed contract and untrusted evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and generate Prisma
        run: |
          npm ci
          npm run prisma:generate
      - name: Typecheck and contract guardrails
        run: |
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
      - name: Focused weekly prompt Jest
        run: npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/openai-responses-reader-summary-weekly-prompt.spec.ts
