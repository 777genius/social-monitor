name: Social Monitor 665 weekly evidence focused checks
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/social-monitor-665-weekly-evidence-focused.yml

permissions:
  contents: read

jobs:
  weekly_schema:
    name: Weekly evidence schema and focused Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Check out exact review commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate pinned Prisma client
        run: npm run prisma:generate
      - name: Typecheck source and specs
        run: npx tsc --noEmit
      - name: Test weekly schema invariants
        run: npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/openai-responses-reader-summary-weekly-prompt.spec.ts
