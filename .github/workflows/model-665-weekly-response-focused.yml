# Temporary branch-scoped verification only; no deploy, no release/Ready override.
name: Model 665 weekly response focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-weekly-response-focused.yml
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-expanded-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-section-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-sealed-compact-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-expanded-legacy-normalization.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-envelope-boundaries.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-parser.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-contract.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-failure.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-records.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-state.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-output-text.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-contract.spec.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact head and frozen original history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked installation and Prisma
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Frozen lineage and architecture gates
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Weekly response failures and public adapter behavior
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-parser.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-envelope-boundaries.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-legacy-normalization.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-response-contract.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-model.adapter.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-weekly-failure-policy.spec.ts
