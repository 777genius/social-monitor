# Temporary source/test qualification for Draft PR #665. Delete after completion.
name: Model 665 deterministic document qualification
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-deterministic-document-focused.yml
permissions:
  contents: read
jobs:
  focused:
    name: Types, architecture, cap, deterministic reader contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify TypeScript, architecture and strict 1000LOC cap
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
      - name: Verify deterministic reader presentation and publication
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand \
            libs/summary/adapters/model/deterministic-reader-summary-model.adapter.spec.ts \
            libs/summary/adapters/model/deterministic-reader-summary-narrative.spec.ts
