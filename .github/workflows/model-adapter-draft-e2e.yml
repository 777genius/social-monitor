# Scoped temporary qualification for the two synthetic model-adapter E2E suites.
# Does not replace the full Ready PR 20/20 release gates.
name: Model adapter draft E2E

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-adapter-draft-e2e.yml
      - test/e2e/summary-model-adapters-provider-boundary.e2e-spec.ts
      - test/e2e/summary-model-agent-runtime-boundary.e2e-spec.ts

permissions:
  contents: read

concurrency:
  group: model-adapter-draft-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic_model_e2e:
    name: Synthetic model boundaries through Nest REST
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate pinned Prisma client
        run: npm run prisma:generate

      - name: Run both synthetic provider E2E suites
        run: |
          set -euo pipefail
          npx jest --config test/jest-e2e.config.ts --runInBand --runTestsByPath \
            test/e2e/summary-model-adapters-provider-boundary.e2e-spec.ts \
            test/e2e/summary-model-agent-runtime-boundary.e2e-spec.ts

      - name: Run source-policy regression specs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/openai-responses-summary-repository-evidence.spec.ts \
            libs/summary/adapters/model/deterministic-summary-budget-policy.spec.ts \
            libs/summary/adapters/model/agent-runtime-summary-model.adapter.spec.ts \
            libs/summary/adapters/model/openai-responses-summary-model.adapter.spec.ts
