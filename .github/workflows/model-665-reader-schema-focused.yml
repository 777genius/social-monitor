# Temporary exact-source Draft PR #665 model request boundary gate. No provider calls.
name: Model 665 reader schema responsibilities focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-reader-schema-focused.yml
      - libs/summary/adapters/model/reader-summary-evidence-citation-map.ts
      - libs/summary/adapters/model/reader-summary-citable-evidence.ts
      - libs/summary/adapters/model/reader-summary-citation-map-projection.ts
      - libs/summary/adapters/model/reader-summary-citation-map-projection.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-policy-projection.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-enabled-sections.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-mandatory-quality.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-policy-projection.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-lineage.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-json-schema.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-json-schema.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-base-schema.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-daily-writer-schema.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-daily-writer-schema.spec.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-daily-synthesis-citation-policy.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-prompt.ts
      - libs/summary/adapters/model/reader-summary-prompt-release-policy.ts
      - libs/summary/adapters/model/reader-summary-prompt-release-policy.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-options.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-options.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
      - libs/summary/adapters/model/openai-responses-reader-summary-editorial-schema.ts
      - libs/summary/adapters/model/openai-responses-reader-summary-next-action-schema.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify strict types and architecture hard gates
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Verify reader schema ownership and existing OpenAI adapter contract
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/reader-summary-citation-map-projection.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-draft-normalizer.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-draft-policy-projection.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-json-schema.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-daily-writer-schema.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-model.adapter.spec.ts
          libs/summary/adapters/model/reader-summary-prompt-release-policy.spec.ts
          libs/summary/adapters/model/openai-responses-reader-summary-prompt-boundaries.spec.ts
          libs/summary/adapters/model/reader-summary-prompt-release-options.spec.ts
