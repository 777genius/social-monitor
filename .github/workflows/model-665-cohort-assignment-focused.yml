# Temporary exact-code verification for a bounded PR #665 refactor slice.
# This is not the final Ready 20/20 gate; remove only after a terminal PASS.
name: Model 665 cohort and gateway attempt identity focused
on:
  pull_request:
    paths:
      - .github/workflows/model-665-cohort-assignment-focused.yml
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-completion.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.spec.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempts.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempt-identity-policy.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempt-identity-policy.spec.ts
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-cohort-assignment-focused.yml
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-completion.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.spec.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempts.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempt-identity-policy.ts
      - libs/summary/adapters/model/gateway-llm/gateway-llm-attempt-identity-policy.spec.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Verify strict TypeScript and architectural boundaries
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Test cohort integrity and gateway attempt admission
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/gateway-llm/gateway-llm-attempt-identity-policy.spec.ts
          libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-integrity.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-cohort-grouping.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-anchor-policy.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-recovery.spec.ts
