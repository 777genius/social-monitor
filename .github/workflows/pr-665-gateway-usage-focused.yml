name: PR 665 gateway usage focused qualification
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/pr-665-gateway-usage-focused.yml
      - libs/summary/adapters/model/gateway-llm/**
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

jobs:
  gateway_usage:
    name: Gateway usage model regression / TS / architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma
        run: npm run prisma:generate
      - name: Typecheck and architecture contracts
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run check:architecture
          npm run check:source-line-cap
      - name: Focused gateway settlement and model safety Jest
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/gateway-llm/gateway-llm-usage.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts \
            libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-verifier.adapter.spec.ts \
            libs/summary/adapters/model/agent-runtime-reader-summary-story-relation-decoder.spec.ts
