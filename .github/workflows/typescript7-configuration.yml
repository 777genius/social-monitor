name: Native TypeScript 7 configuration qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tsconfig.json
      - scripts/check-architecture.mjs
      - scripts/ci/typescript7-config-contract.test.ts
      - .github/workflows/typescript7-configuration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_ts7:
    name: Native TypeScript 7 compatibility (non-merge qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up supported backend Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Install declared project dependencies without running legacy compiler hooks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the real Prisma client from the checked-in schema
        # Prisma config validates DATABASE_URL even when generation does not connect to a DB.
        # Deliberately local and credential-free; no production database is used.
        env:
          DATABASE_URL: postgresql://ci@127.0.0.1:5432/social_monitor_ci
        run: ./node_modules/.bin/prisma generate --schema prisma/schema.prisma

      - name: Install an isolated exact native TypeScript 7.0.2 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-ts7"
          npm --prefix "$RUNNER_TEMP/native-ts7" install \
            --no-save --ignore-scripts --no-audit --no-fund \
            --package-lock=false --save-exact typescript@7.0.2
          TS7_DIR="$RUNNER_TEMP/native-ts7" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const p = JSON.parse(readFileSync(process.env.TS7_DIR + "/node_modules/typescript/package.json", "utf8"));
            if (p.version !== "7.0.2") throw new Error("Expected the exact native TypeScript 7.0.2 compiler");
            console.log("Native TypeScript:", p.version);
          '

      - name: Prove unchanged alias identity and strict options without legacy compiler APIs
        run: node --experimental-strip-types --test scripts/ci/typescript7-config-contract.test.ts

      - name: Run the real native TypeScript 7.0.2 compiler on the root project
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/native-ts7/node_modules/.bin/tsc" --version
          "$RUNNER_TEMP/native-ts7/node_modules/.bin/tsc" -p tsconfig.json --noEmit
