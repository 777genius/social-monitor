# Temporary exact-source focused gate for model attempt metrics in single Draft PR #665.
# No release, deploy, schema, dependency or protected-branch changes.
name: Model 665 summary attempt metering focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-summary-metering-focused.yml
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
      - libs/summary/adapters/model/summary-model-metered-attempt.ts
      - libs/summary/adapters/model/metered-summary-model.adapter.ts
      - libs/summary/adapters/model/metered-summary-model.adapter.spec.ts
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact HEAD and pinned original baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Exact pinned-origin provenance, TypeScript and boundary guards
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Summary and reader model metrics regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/metered-summary-model.adapter.spec.ts
          libs/summary/adapters/model/reader-summary-metered-attempt.spec.ts
          libs/summary/adapters/model/metered-reader-summary-model.adapter.spec.ts
