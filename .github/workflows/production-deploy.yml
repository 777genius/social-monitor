            node ops/deploy/production-runtime/rolling-summary-receipt.test.mjs && bash ops/deploy/production-runtime/rolling-run.test.sh && bash ops/deploy/production-runtime/daily-run.test.sh && bash ops/deploy/social-monitor-production-deploy.test.sh
            bash ops/deploy/deploy-control-lib.test.sh
