# Temporary exact-code-head focused Jest qualification for the existing Draft PR #665.
# This is NOT the 20/20 Ready gate; remove after recording real results.
name: Model adapter focused Jest draft

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-refactor-focused-jest-draft.yml

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

concurrency:
  group: model-adapter-focused-jest-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model_adapter_regressions:
    name: Adaptive evidence and story citation trust Jest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate pinned Prisma client
        run: npm run prisma:generate
      - name: Focused pure-model Jest checks (no external models)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath \\
            libs/summary/adapters/model/openai-responses-reader-summary-adaptive-evidence.spec.ts \\
            libs/summary/adapters/model/openai-responses-reader-summary-story-normalizer.spec.ts \\
            libs/summary/adapters/model/openai-responses-reader-summary-story-input.spec.ts
