# Temporary exact-SHA focused qualification for the existing Draft PR #665.
name: PR 665 provider identity and original-position audit
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-provider-identity-focused.yml
      - libs/summary/adapters/model/summary-provider-*
      - scripts/audit-summary-model-original-files.mjs
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22 and cache
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked install and Prisma generate
        run: |
          npm ci
          npm run prisma:generate
      - name: Original position audit and full static gates
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Focused provider identity and summary adapter regressions
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/summary-provider-labels.spec.ts
          libs/summary/adapters/model/deterministic-reader-summary-model.adapter.spec.ts
          libs/summary/adapters/model/deterministic-summary-model.adapter.spec.ts
