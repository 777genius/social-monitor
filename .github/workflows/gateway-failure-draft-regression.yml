# One-off model-adapter policy qualification; remove after a successful run.
name: Gateway failure draft regression

on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/gateway-failure-draft-regression.yml
      - libs/summary/adapters/model/gateway-llm/gateway-llm-failure*.ts

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci

concurrency:
  group: gateway-failure-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe_gateway_failures:
    name: Gateway LLM failure taxonomy and schema safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Generate pinned Prisma client
        run: npm run prisma:generate
      - name: Run entire gateway LLM policy regression family
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npx jest --config jest.config.ts --runInBand --runTestsByPath \
            libs/summary/adapters/model/gateway-llm/gateway-llm-client.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-failure-policies.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-output-schema.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-output-violations.spec.ts \
            libs/summary/adapters/model/gateway-llm/gateway-llm-request-identity.spec.ts
