# Temporary branch-only evidence for historical frozen-origin reconstruction in Draft #665.
name: Model 665 deterministic origin focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-deterministic-origin-focused.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout current SHA with pinned 2026-11-08 original history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Locked dependencies and generated Prisma
        run: |
          set -euo pipefail
          npm ci
          npm run prisma:generate
      - name: Audit frozen original and verify architectural hard gates
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Verify deterministic summary split contracts
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/deterministic-summary-budget-policy.spec.ts
          libs/summary/adapters/model/deterministic-summary-draft.spec.ts
          libs/summary/adapters/model/deterministic-summary-source-highlights.spec.ts
          libs/summary/adapters/model/deterministic-summary-model.adapter.spec.ts
