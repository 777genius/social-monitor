name: Model adapter gRPC focused qualification (#665)
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-refactor-665-focused.yml
      - libs/summary/adapters/model/grpc-agent-runtime-client.ts
      - libs/summary/adapters/model/grpc-agent-runtime-client.spec.ts
      - libs/summary/adapters/model/grpc-agent-runtime-task-invocation.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-transport:
    name: gRPC task transport regression and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
      - run: npm run check:architecture
      - run: npm run check:code-quality
      - run: npm run check:source-line-cap
      - run: npm run check:runtime-profile-guards
      - run: npx jest --config jest.config.ts --runInBand --runTestsByPath libs/summary/adapters/model/grpc-agent-runtime-client.spec.ts
