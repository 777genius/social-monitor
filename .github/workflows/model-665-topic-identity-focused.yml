# Temporary PR #665 synthetic topic-identity verification, no paid calls.
# Does not replace full Ready 20/20, native PostgreSQL 18, security, image, E2E.
name: Model 665 topic identity policy focused
on:
  push:
    branches:
      - refactor/summary-model-adapters-10k-20261108
    paths:
      - .github/workflows/model-665-topic-identity-focused.yml
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-grounded-cohorts.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-anchor-policy.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-anchor-policy.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-recovery.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-consensus.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-support.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-support.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-completion.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-admission.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-admission.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-grounding.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-keys.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-policy.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-label-plan-normalizer.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-assignment.spec.ts
      - libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-keys.spec.ts
      - docs/iterations/2026-11-08-summary-model-adapters-10k-positions.json
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://social_monitor_ci:social_monitor_local_password@127.0.0.1:5432/social_monitor_ci
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Strict static and runtime policy checks
        run: |
          set -euo pipefail
          node scripts/audit-summary-model-original-files.mjs
          npx tsc --noEmit
          npm run check:architecture
          npm run check:code-quality
          npm run check:source-line-cap
          npm run check:runtime-profile-guards
      - name: Topic identity and cohort integration Jest
        run: >-
          npx jest --config jest.config.ts --runInBand --runTestsByPath
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-candidate-anchor-policy.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-integrity.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-admission.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-grounding.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-cohort-assignment.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-keys.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-anchor-support.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-assignment.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-labeler.adapter.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-topic-group-recovery.spec.ts
          libs/summary/adapters/model/agent-runtime-reader-summary-cohort-grouping.spec.ts
