[project]
name = "social-monitor-x-collector"
version = "0.1.0"
description = "Private gRPC X/Twitter collector for Social Monitor"
requires-python = ">=3.11,<3.14"
dependencies = [
  "Scweet==5.3",
  "grpcio==1.81.1",
  "grpcio-tools==1.81.1",
  "protobuf>=6.33.5,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=77.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

