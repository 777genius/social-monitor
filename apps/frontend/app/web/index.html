<!DOCTYPE html>
<html>
<head>

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Social Monitor">
  <link rel="modulepreload" href="main.dart.mjs">
  <link rel="preload" href="main.dart.wasm" as="fetch" type="application/wasm" crossorigin="use-credentials">
  <link rel="preload" href="canvaskit/skwasm.wasm" as="fetch" type="application/wasm" crossorigin="use-credentials">
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #081120;
      color: #e7edf8;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    flutter-view,
    flt-glass-pane {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100%;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(1200px 620px at 50% 34%, rgba(49, 88, 220, 0.16), transparent 70%),
        radial-gradient(760px 520px at 82% 88%, rgba(38, 208, 176, 0.09), transparent 72%),
        #081120;
    }

    #app-loader.is-leaving {
      animation: app-loader-out 380ms ease both;
    }

    @keyframes app-loader-out {
      to { opacity: 0; transform: scale(1.015); visibility: hidden; }
    }

    .app-loader-stage {
      display: grid;
      justify-items: center;
      gap: 26px;
      padding: 28px;
      width: min(460px, 90vw);
      text-align: center;
    }

    /* ---- scene ---- */
    .loader-scene {
      position: relative;
      width: min(320px, 82vw);
      aspect-ratio: 1 / 1;
    }

    .loader-orbit {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      border: 1px dashed rgba(124, 155, 255, 0.14);
      animation: loader-orbit-spin 46s linear infinite;
    }

    @keyframes loader-orbit-spin { to { transform: rotate(360deg); } }

    /* ---- social source logos ---- */
    .loader-logo {
      position: absolute;
      width: 16.25%;   /* 52 / 320 */
      height: 16.25%;
      margin: -8.125% 0 0 -8.125%;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.45));
      animation: loader-logo-float 3.4s ease-in-out infinite;
    }
    .loader-logo svg { width: 100%; height: 100%; display: block; }

    /* ring positions (center 50%,50%; radius 37.5%; even pentagon) */
    .loader-logo--reddit   { left: 50%;    top: 12.5%;  animation-delay: 0s; }
    .loader-logo--x        { left: 85.67%; top: 38.41%; animation-delay: .4s; }
    .loader-logo--telegram { left: 72.04%; top: 80.34%; animation-delay: .8s; }
    .loader-logo--youtube  { left: 27.96%; top: 80.34%; animation-delay: 1.2s; }
    .loader-logo--facebook { left: 14.33%; top: 38.41%; animation-delay: 1.6s; }

    @keyframes loader-logo-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* ---- travelling posts ---- */
    .loader-post {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 38px;
      margin: -19px 0 0 -28px;
      border-radius: 8px;
      background: #f3f7ff;
      box-shadow: 0 8px 20px rgba(4, 10, 24, 0.5);
      padding: 6px 7px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      z-index: 2;
      will-change: transform, opacity;
      animation: loader-post-suck 4.8s cubic-bezier(0.5, 0.02, 0.72, 0.28) infinite;
    }
    .loader-post .bar { height: 5px; width: 60%; border-radius: 3px; background: var(--tint, #3158dc); }
    .loader-post .ln { height: 4px; border-radius: 3px; background: #c3ccdd; }
    .loader-post .ln.s { width: 70%; }

    @keyframes loader-post-suck {
      0%    { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
      2.2%  { transform: translate(var(--dx), var(--dy)) scale(1);   opacity: 1; }
      11.5% { transform: translate(0px, 0px) scale(0.34);            opacity: 1; }
      12.6% { transform: translate(0px, 0px) scale(0.04);            opacity: 0; }
      100%  { transform: translate(0px, 0px) scale(0.04);            opacity: 0; }
    }

    /* ---- central server ---- */
    .loader-server-halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 168px;
      height: 168px;
      margin: -84px 0 0 -84px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 116, 255, 0.34), rgba(79, 116, 255, 0) 68%);
      z-index: 1;
      animation: loader-halo-breathe 2.4s ease-in-out infinite;
    }

    @keyframes loader-halo-breathe {
      0%, 100% { transform: scale(0.94); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .loader-shock {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border-radius: 50%;
      border: 2px solid rgba(120, 176, 255, 0.7);
      opacity: 0;
      z-index: 1;
      will-change: transform, opacity;
      animation: loader-shock 4.8s linear infinite;
    }

    .loader-server {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      margin: -44px 0 0 -44px;
      z-index: 3;
      transform-origin: center bottom;
      will-change: transform;
      animation: loader-server-jolt 4.8s linear infinite;
    }
    .loader-server svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(30, 56, 172, 0.55)); }

    .loader-led { animation: loader-led-blink 1.1s steps(1, end) infinite; }
    .loader-led--2 { animation-delay: .55s; }
    @keyframes loader-led-blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0.35; } }

    /* precise, synchronised jolt: server jumps sharply exactly when a post lands */
    @keyframes loader-server-jolt {
      0.0% { transform: translate(0,0) scale(1); }
      10.858% { transform: translate(0,0) scale(1); }
      11.458% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      12.458% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      13.858% { transform: translate(0,0) scale(1); }
      17.108% { transform: translate(0,0) scale(1); }
      17.708% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      18.708% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      20.108% { transform: translate(0,0) scale(1); }
      23.358% { transform: translate(0,0) scale(1); }
      23.958% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      24.958% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      26.358% { transform: translate(0,0) scale(1); }
      29.608% { transform: translate(0,0) scale(1); }
      30.208% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      31.208% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      32.608% { transform: translate(0,0) scale(1); }
      50.442% { transform: translate(0,0) scale(1); }
      51.042% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      52.042% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      53.442% { transform: translate(0,0) scale(1); }
      56.692% { transform: translate(0,0) scale(1); }
      57.292% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      58.292% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      59.692% { transform: translate(0,0) scale(1); }
      62.942% { transform: translate(0,0) scale(1); }
      63.542% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      64.542% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      65.942% { transform: translate(0,0) scale(1); }
      83.775% { transform: translate(0,0) scale(1); }
      84.375% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      85.375% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      86.775% { transform: translate(0,0) scale(1); }
      90.025% { transform: translate(0,0) scale(1); }
      90.625% { transform: translate(0,-9px) scaleX(1.16) scaleY(0.9); }
      91.625% { transform: translate(0,4px) scaleX(0.92) scaleY(1.12); }
      93.025% { transform: translate(0,0) scale(1); }
      100.0% { transform: translate(0,0) scale(1); }
    }

    @keyframes loader-shock {
      0.0% { opacity:0; transform:scale(.35); }
      11.158% { opacity:0; transform:scale(.35); }
      11.458% { opacity:.55; transform:scale(.4); }
      14.458% { opacity:0; transform:scale(1.7); }
      17.408% { opacity:0; transform:scale(.35); }
      17.708% { opacity:.55; transform:scale(.4); }
      20.708% { opacity:0; transform:scale(1.7); }
      23.658% { opacity:0; transform:scale(.35); }
      23.958% { opacity:.55; transform:scale(.4); }
      26.958% { opacity:0; transform:scale(1.7); }
      29.908% { opacity:0; transform:scale(.35); }
      30.208% { opacity:.55; transform:scale(.4); }
      33.208% { opacity:0; transform:scale(1.7); }
      50.742% { opacity:0; transform:scale(.35); }
      51.042% { opacity:.55; transform:scale(.4); }
      54.042% { opacity:0; transform:scale(1.7); }
      56.992% { opacity:0; transform:scale(.35); }
      57.292% { opacity:.55; transform:scale(.4); }
      60.292% { opacity:0; transform:scale(1.7); }
      63.242% { opacity:0; transform:scale(.35); }
      63.542% { opacity:.55; transform:scale(.4); }
      66.542% { opacity:0; transform:scale(1.7); }
      84.075% { opacity:0; transform:scale(.35); }
      84.375% { opacity:.55; transform:scale(.4); }
      87.375% { opacity:0; transform:scale(1.7); }
      90.325% { opacity:0; transform:scale(.35); }
      90.625% { opacity:.55; transform:scale(.4); }
      93.625% { opacity:0; transform:scale(1.7); }
      100.0% { opacity:0; transform:scale(.35); }
    }

    /* ---- copy ---- */
    .app-loader-title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #eef3ff;
    }

    .app-loader-subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      font-weight: 500;
      color: #8ea3cf;
    }

    .app-loader-progress {
      position: relative;
      width: min(260px, 70vw);
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(124, 155, 255, 0.14);
    }

    .app-loader-progress::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #4f74ff 45%, #6ee7c7 100%);
      animation: loader-progress 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes loader-progress {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loader * {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
      .loader-post { display: none; }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Social Monitor">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Social Monitor</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var hash = window.location.hash;
      if (hash && hash.indexOf('#/') === 0) {
        var path = hash.substring(1);
        window.history.replaceState(null, '', path);
      }
    })();
  </script>
</head>
<body>
  <div id="app-loader" aria-live="polite" aria-label="Loading Social Monitor">
    <div class="app-loader-stage">
      <div class="loader-scene" aria-hidden="true">
        <div class="loader-orbit"></div>

        <!-- social source logos around the server -->
        <div class="loader-logo loader-logo--reddit">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="#FF4500"/>
            <circle cx="20" cy="23.5" r="9" fill="#fff"/>
            <circle cx="11" cy="21.5" r="3" fill="#fff"/>
            <circle cx="29" cy="21.5" r="3" fill="#fff"/>
            <circle cx="16.4" cy="22.6" r="1.7" fill="#FF4500"/>
            <circle cx="23.6" cy="22.6" r="1.7" fill="#FF4500"/>
            <path d="M16 27.4 Q20 30 24 27.4" stroke="#FF4500" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <line x1="27.5" y1="11" x2="24" y2="17.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="28" cy="10" r="2.4" fill="#fff"/>
          </svg>
        </div>
        <div class="loader-logo loader-logo--x">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="#0b0f14"/>
            <path d="M13 12.5 L27 27.5 M27 12.5 L13 27.5" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="loader-logo loader-logo--telegram">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="#229ED9"/>
            <path d="M9 19.4 L30 11.2 L26.4 29 L19.6 24 L16.2 27.2 L15.7 21.6 Z" fill="#fff"/>
            <path d="M15.9 21.9 L26.6 15.2 L18.7 23.2 Z" fill="#cfeaf7"/>
          </svg>
        </div>
        <div class="loader-logo loader-logo--youtube">
          <svg viewBox="0 0 40 40">
            <rect x="1" y="8" width="38" height="24" rx="7" fill="#FF0033"/>
            <path d="M16.5 14 L27 20 L16.5 26 Z" fill="#fff"/>
          </svg>
        </div>
        <div class="loader-logo loader-logo--facebook">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="20" fill="#1877F2"/>
            <path d="M23.5 13.5 h2.6 V9.3 h-3.6 c-3.4 0 -5.2 2 -5.2 5.3 v2.7 h-3.1 v4.4 h3.1 V32 h4.9 V21.7 h3.6 l0.6 -4.4 h-4.2 v-2.1 c0 -1.1 0.4 -1.7 1.8 -1.7 Z" fill="#fff"/>
          </svg>
        </div>

        <!-- server halo + impact shockwave -->
        <div class="loader-server-halo"></div>
        <div class="loader-shock"></div>

        <!-- flying posts sucked into the server (staggered bursts) -->
        <div class="loader-post" style="--dx:0px;--dy:-120px;--tint:#FF4500;animation-delay:-0.002s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:114px;--dy:-37px;--tint:#0b0f14;animation-delay:0.298s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:70px;--dy:97px;--tint:#229ED9;animation-delay:0.598s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:-70px;--dy:97px;--tint:#FF0033;animation-delay:0.898s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:-114px;--dy:-37px;--tint:#1877F2;animation-delay:1.898s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:0px;--dy:-120px;--tint:#FF4500;animation-delay:2.198s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:114px;--dy:-37px;--tint:#0b0f14;animation-delay:2.498s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:70px;--dy:97px;--tint:#229ED9;animation-delay:3.498s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>
        <div class="loader-post" style="--dx:-70px;--dy:97px;--tint:#FF0033;animation-delay:3.798s"><span class="bar"></span><span class="ln"></span><span class="ln s"></span></div>

        <!-- the server that ingests everything -->
        <div class="loader-server">
          <svg viewBox="0 0 88 88">
            <defs>
              <linearGradient id="srvGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5b7dff"/>
                <stop offset="1" stop-color="#2338ac"/>
              </linearGradient>
            </defs>
            <rect x="10" y="10" width="68" height="68" rx="18" fill="url(#srvGrad)" stroke="rgba(160,190,255,0.55)" stroke-width="1.4"/>
            <rect x="24" y="26" width="40" height="9" rx="4.5" fill="rgba(255,255,255,0.92)"/>
            <rect x="24" y="40" width="40" height="9" rx="4.5" fill="rgba(255,255,255,0.6)"/>
            <rect x="24" y="54" width="40" height="9" rx="4.5" fill="rgba(255,255,255,0.4)"/>
            <circle class="loader-led" cx="30" cy="30.5" r="2.4" fill="#38e0b0"/>
            <circle class="loader-led loader-led--2" cx="30" cy="44.5" r="2.4" fill="#ffd23f"/>
          </svg>
        </div>
      </div>

      <div class="app-loader-copy">
        <p class="app-loader-title">Social Monitor</p>
        <p class="app-loader-subtitle">Pulling in posts from across social networks</p>
      </div>

      <div class="app-loader-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (!loader) {
        return;
      }
      loader.classList.add('is-leaving');
      var done = function () {
        if (loader && loader.parentNode) {
          loader.remove();
        }
      };
      loader.addEventListener('animationend', done, { once: true });
      window.setTimeout(done, 700);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
