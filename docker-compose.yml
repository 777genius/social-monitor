name: social-monitor-local

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env.example
  environment: &app-env
    NODE_ENV: ${NODE_ENV:-staging}
    SOCIAL_MONITOR_RUNTIME_PROFILE: ${SOCIAL_MONITOR_RUNTIME_PROFILE:-beta}
    TRUSTED_WORKSPACE_ROLE_HEADER: ${TRUSTED_WORKSPACE_ROLE_HEADER:-disabled}
    DATABASE_URL: postgresql://social_monitor:social_monitor_local_password@postgres:5432/social_monitor
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://social_monitor:social_monitor_local_password@rabbitmq:5672
    RABBITMQ_DEAD_LETTER_EXCHANGE: social-monitor.commands.dlx
    RABBITMQ_QUEUE_TYPE: quorum
    RABBITMQ_QUEUE_DELIVERY_LIMIT: "20"
    MONITORING_PERSISTENCE: prisma
    MONITORING_SCAN_QUEUE: rabbitmq
    FEED_PERSISTENCE: prisma
    RELEVANCE_PERSISTENCE: prisma
    SUMMARY_PERSISTENCE: prisma
    SUMMARY_JOB_QUEUE_MODE: rabbitmq
    SUMMARY_MODEL_PROVIDER: ${SUMMARY_MODEL_PROVIDER:-deterministic}
    READER_SUMMARY_MODEL_PROVIDER: ${READER_SUMMARY_MODEL_PROVIDER:-agent-runtime}
    READER_SUMMARY_TOPIC_LABELER: ${READER_SUMMARY_TOPIC_LABELER:-agent-runtime}
    AGENT_RUNTIME_GRPC_ADDRESS: ${AGENT_RUNTIME_GRPC_ADDRESS:-agent-runtime:50052}
    AGENT_RUNTIME_SERVICE_TOKEN: ${AGENT_RUNTIME_SERVICE_TOKEN:-}
    AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-codex}
    AGENT_RUNTIME_READER_SUMMARY_MODEL: ${AGENT_RUNTIME_READER_SUMMARY_MODEL:-gpt-5.5}
    AGENT_RUNTIME_READER_SUMMARY_REASONING_EFFORT: ${AGENT_RUNTIME_READER_SUMMARY_REASONING_EFFORT:-xhigh}
    AGENT_RUNTIME_TIMEOUT_MS: ${AGENT_RUNTIME_TIMEOUT_MS:-120000}
    AGENT_RUNTIME_SUMMARY_TIMEOUT_MS: ${AGENT_RUNTIME_SUMMARY_TIMEOUT_MS:-120000}
    AGENT_RUNTIME_READER_SUMMARY_TIMEOUT_MS: ${AGENT_RUNTIME_READER_SUMMARY_TIMEOUT_MS:-600000}
    AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_TIMEOUT_MS: ${AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_TIMEOUT_MS:-600000}
    AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_MAX_CANDIDATES: ${AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_MAX_CANDIDATES:-30}
    AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_PROMPT_VERSION: ${AGENT_RUNTIME_READER_SUMMARY_TOPIC_LABELER_PROMPT_VERSION:-reader_summary.topic_map.agent_runtime.v4}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-}
    OPENAI_SUMMARY_PROMPT_VERSION: ${OPENAI_SUMMARY_PROMPT_VERSION:-}
    OPENAI_SUMMARY_TIMEOUT_MS: ${OPENAI_SUMMARY_TIMEOUT_MS:-}
    OPENAI_SUMMARY_MAX_OUTPUT_TOKENS: ${OPENAI_SUMMARY_MAX_OUTPUT_TOKENS:-}
    OPENAI_SUMMARY_INPUT_COST_USD_PER_MILLION_TOKENS: ${OPENAI_SUMMARY_INPUT_COST_USD_PER_MILLION_TOKENS:-}
    OPENAI_SUMMARY_OUTPUT_COST_USD_PER_MILLION_TOKENS: ${OPENAI_SUMMARY_OUTPUT_COST_USD_PER_MILLION_TOKENS:-}
    DELIVERY_PERSISTENCE: prisma
    DELIVERY_ENABLED_CHANNELS: webhook
    DELIVERY_WEBHOOK_PROVIDER: http
    DELIVERY_ATTEMPT_DISPATCH_TARGET: queue
    DELIVERY_ATTEMPT_DISPATCH_QUEUE: rabbitmq
    DELIVERY_ATTEMPT_QUEUE_READER: rabbitmq
    DELIVERY_SUMMARY_READY_EVENT_READER: rabbitmq
    SUBSCRIPTIONS_PERSISTENCE: prisma
    IDENTITY_PERSISTENCE: prisma
    USAGE_PERSISTENCE: prisma
    INGESTION_SUPPORT_PERSISTENCE: prisma
    INGESTION_WORKER_PERSISTENCE: prisma
    INGESTION_SCAN_QUEUE_READER: rabbitmq
    INGESTION_SCAN_REPORTER: monitoring
    INTELLIGENCE_SUMMARY_QUEUE_READER: rabbitmq
    SOURCE_CONFIG_ENCRYPTION_KEY: ${SOURCE_CONFIG_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
    SOURCE_CONFIG_ENCRYPTION_KEY_ID: ${SOURCE_CONFIG_ENCRYPTION_KEY_ID:-local-dev}
    SOURCE_CREDENTIAL_SECRET_ENCRYPTION_KEY: ${SOURCE_CREDENTIAL_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
    DELIVERY_WEBHOOK_SECRET_ENCRYPTION_KEY: ${DELIVERY_WEBHOOK_SECRET_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
    SOCIAL_MONITOR_USER_AUTH_MODE: ${SOCIAL_MONITOR_USER_AUTH_MODE:-oidc-jwt}
    SOCIAL_MONITOR_OIDC_TENANT_ID_CLAIM: ${SOCIAL_MONITOR_OIDC_TENANT_ID_CLAIM:-tenant_id}
    SOCIAL_MONITOR_OIDC_WORKSPACE_ID_CLAIM: ${SOCIAL_MONITOR_OIDC_WORKSPACE_ID_CLAIM:-workspace_id}
    SOCIAL_MONITOR_OIDC_WORKSPACE_ROLES_CLAIM: ${SOCIAL_MONITOR_OIDC_WORKSPACE_ROLES_CLAIM:-workspace_roles}
    REDDIT_APP_CLIENT_ID: ${REDDIT_APP_CLIENT_ID:-}
    REDDIT_APP_CLIENT_SECRET: ${REDDIT_APP_CLIENT_SECRET:-}
    REDDIT_APP_USER_AGENT: ${REDDIT_APP_USER_AGENT:-social-monitor-mvp/0.1 reddit-app-only}
    SUMMARY_MEMORY_MODE: ${SUMMARY_MEMORY_MODE:-disabled}
    INFINITY_CONTEXT_URL: ${INFINITY_CONTEXT_URL:-}
    INFINITY_CONTEXT_TOKEN: ${INFINITY_CONTEXT_TOKEN:-}
    SUMMARY_MEMORY_TIMEOUT_MS: ${SUMMARY_MEMORY_TIMEOUT_MS:-30000}
  depends_on: &app-depends
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  profiles: ["app"]

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social_monitor_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-social_monitor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-social_monitor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-social_monitor_local_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:4.3.0
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  migrate:
    build:
      context: .
      args:
        SERVICE: api
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      SOCIAL_MONITOR_RUNTIME_PROFILE: beta
      DATABASE_URL: postgresql://social_monitor:social_monitor_local_password@postgres:5432/social_monitor
    command:
      [
        "sh",
        "-c",
        'attempt=1; until npm run migrate:deploy; do if [ "$$attempt" -ge 30 ]; then exit 1; fi; attempt=$$((attempt + 1)); sleep 2; done; npm run seed',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]
    restart: "no"

  api:
    <<: *app-common
    build:
      context: .
      args:
        SERVICE: api
    environment:
      <<: *app-env
      PORT: 3000
      MONITORING_PERSISTENCE: prisma
      MONITORING_SCAN_QUEUE: rabbitmq
      FEED_PERSISTENCE: prisma
      RELEVANCE_PERSISTENCE: prisma
      SUMMARY_PERSISTENCE: prisma
      SUMMARY_JOB_QUEUE_MODE: rabbitmq
      DELIVERY_PERSISTENCE: prisma
      DELIVERY_ENABLED_CHANNELS: webhook
      DELIVERY_WEBHOOK_PROVIDER: http
      SUBSCRIPTIONS_PERSISTENCE: prisma
      IDENTITY_PERSISTENCE: prisma
      USAGE_PERSISTENCE: prisma
      INGESTION_SUPPORT_PERSISTENCE: prisma
    ports:
      - "${API_PORT:-3000}:3000"

  ingestion-worker:
    <<: *app-common
    build:
      context: .
      args:
        SERVICE: ingestion
    environment:
      <<: *app-env
      INGESTION_WORKER_PERSISTENCE: prisma
      INGESTION_SCAN_QUEUE_READER: rabbitmq
      INGESTION_SCAN_QUEUE_DRAIN_LOOP: enabled
      INGESTION_SCAN_SCHEDULER_INTERVAL_MS: 1000
      INGESTION_SCAN_REPORTER: monitoring
      MONITORING_PERSISTENCE: prisma

  intelligence-worker:
    <<: *app-common
    build:
      context: .
      args:
        SERVICE: intelligence
    environment:
      <<: *app-env
      SUMMARY_PERSISTENCE: prisma
      INTELLIGENCE_SUMMARY_QUEUE_READER: rabbitmq
      INTELLIGENCE_SUMMARY_QUEUE_DRAIN_LOOP: enabled
      INTELLIGENCE_SUMMARY_JOB_LOOP: disabled

  agent-runtime:
    build:
      context: .
      args:
        SERVICE: agent-runtime
    env_file:
      - .env.example
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      SOCIAL_MONITOR_RUNTIME_PROFILE: ${SOCIAL_MONITOR_RUNTIME_PROFILE:-beta}
      AGENT_RUNTIME_GRPC_BIND: 0.0.0.0:50052
      AGENT_RUNTIME_SERVICE_TOKEN: ${AGENT_RUNTIME_SERVICE_TOKEN:-}
      AGENT_RUNTIME_CLI_PATH: ${AGENT_RUNTIME_CLI_PATH:-apps/agent-runtime/bin/run-codex-subscription-runtime-agent-task.mjs}
      AGENT_RUNTIME_STATE_ROOT: /var/lib/subscription-runtime
      AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-codex}
      AGENT_RUNTIME_MODEL: ${AGENT_RUNTIME_MODEL:-gpt-5.5}
      AGENT_RUNTIME_REASONING_EFFORT: ${AGENT_RUNTIME_REASONING_EFFORT:-xhigh}
      AGENT_RUNTIME_CODEX_AUTH_JSON_PATH: ${AGENT_RUNTIME_CODEX_AUTH_JSON_PATH:-}
      AGENT_RUNTIME_CLAUDE_TOKEN_ENV: ${AGENT_RUNTIME_CLAUDE_TOKEN_ENV:-CLAUDE_CODE_OAUTH_TOKEN}
      DATABASE_URL: postgresql://social_monitor:social_monitor_local_password@postgres:5432/social_monitor
      SUBSCRIPTION_RUNTIME_LOCAL_ENCRYPTION_KEY: ${SUBSCRIPTION_RUNTIME_LOCAL_ENCRYPTION_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "${AGENT_RUNTIME_GRPC_PORT:-50052}:50052"
    volumes:
      - subscription-runtime-state:/var/lib/subscription-runtime
    profiles: ["app"]

  delivery-service:
    <<: *app-common
    build:
      context: .
      args:
        SERVICE: delivery
    environment:
      <<: *app-env
      DELIVERY_PERSISTENCE: prisma
      DELIVERY_ATTEMPT_DISPATCH_TARGET: queue
      DELIVERY_ATTEMPT_DISPATCH_QUEUE: rabbitmq
      DELIVERY_ATTEMPT_QUEUE_READER: rabbitmq
      DELIVERY_ATTEMPT_QUEUE_DRAIN_LOOP: enabled
      DELIVERY_SUMMARY_READY_EVENT_READER: rabbitmq
      DELIVERY_SUMMARY_READY_EVENT_DRAIN_LOOP: enabled
      DELIVERY_ENABLED_CHANNELS: webhook
      DELIVERY_WEBHOOK_PROVIDER: http

  event-relay:
    <<: *app-common
    build:
      context: .
      args:
        SERVICE: event-relay
    environment:
      <<: *app-env
      EVENT_RELAY_LOOP: enabled

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  kafka-data:
  subscription-runtime-state:
