services:
  ingestion-worker:
    environment:
      DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}

  intelligence-worker:
    environment:
      DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}

  delivery-service:
    environment:
      DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}

  event-relay:
    environment:
      DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}

  daily-runner:
    environment:
      DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}
      SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?SYSTEM_DATABASE_URL is required for tenant-system workers}
      POSTGRES_RUNTIME_PROCESS: daily-runner
      POSTGRES_RUNTIME_POOL_MIN: "0"
      POSTGRES_RUNTIME_POOL_MAX: "2"
    deploy:
      replicas: 1
