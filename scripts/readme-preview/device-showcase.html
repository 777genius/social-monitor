<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Social Monitor · responsive showcase</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1800px;height:1100px;overflow:hidden;background:#080e1c;color:#e8edf8;font-family:Arial,sans-serif}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 65%,#14284b 0,transparent 60%),radial-gradient(ellipse at 8% 12%,#152447 0,transparent 42%)}
header{position:absolute;left:72px;top:58px} .brand{font-size:19px;font-weight:700;letter-spacing:3px;color:#80b4ff;display:flex;gap:14px;align-items:center}.mark{display:grid;place-items:center;background:#198bff;color:white;width:33px;height:33px;border-radius:50%;font-size:30px;letter-spacing:0}
h1{font-size:62px;line-height:1.08;letter-spacing:-2px;margin:23px 0 18px;font-weight:700}header p{font-size:21px;color:#97a7c2;margin:0}.date{position:absolute;right:74px;top:72px;color:#97a7c2;font-size:15px;letter-spacing:2px}
.device{position:absolute;filter:drop-shadow(0 25px 28px #0008)} .screen{overflow:hidden;background:#09111f}.screen img{display:block;width:100%;height:100%}
.phone{left:64px;top:450px;width:236px;padding:9px;border:2px solid #71809a;border-radius:37px;background:linear-gradient(110deg,#536079,#111723 10%,#0a0f19 90%,#61708a)}.phone .screen{width:214px;height:463px;border-radius:26px}.speaker{height:5px;width:38px;border-radius:9px;background:#334158;margin:0 auto 6px}.home{height:4px;width:66px;border-radius:4px;background:#a2acc0;margin:9px auto 3px}
.tablet{left:340px;top:335px;width:420px;padding:14px;border:2px solid #71809a;border-radius:29px;background:linear-gradient(110deg,#46536b,#131a29 14%,#0b101a 88%,#59667f)}.tablet .screen{width:388px;height:558px;border-radius:13px}.camera{width:5px;height:5px;background:#53627c;border-radius:50%;margin:-6px auto 7px}
.laptop{left:802px;top:292px;width:925px}.lid{padding:14px 14px 17px;background:linear-gradient(110deg,#63718a,#151d2b 4%,#0a101b 96%,#64718a);border:2px solid #71809a;border-radius:22px 22px 9px 9px}.laptop .screen{width:893px;height:595px;border-radius:7px}.base{height:22px;width:1005px;position:relative;left:-40px;background:linear-gradient(#8896ad,#45516a 65%,#273348);border-radius:2px 2px 50% 50% / 2px 2px 90% 90%;border-top:1px solid #b5c0d1}.base:before{content:"";position:absolute;top:0;left:41%;width:18%;height:7px;background:#2b374f;border-radius:0 0 15px 15px}
.caption{position:absolute;top:995px;color:#899bb7;font-size:15px;letter-spacing:2px;text-align:center}.caption strong{display:block;color:#d5dff0;font-size:17px;letter-spacing:0;margin-bottom:9px}.mobile-label{left:64px;width:236px}.tablet-label{left:340px;width:420px}.desktop-label{left:802px;width:925px}
</style>
<header><div class="brand"><span class="mark">+</span>SOCIAL MONITOR</div><h1>Follow your interests.<br>Skip the noise.</h1><p>Your daily briefing, wherever you read.</p></header>
<div class="date">DAILY SUMMARY · {{DATE}}</div>
<div class="device laptop"><div class="lid"><div class="screen"><img src="{{DESKTOP}}" alt="Desktop summary"></div></div><div class="base"></div></div>
<div class="device tablet"><div class="camera"></div><div class="screen"><img src="{{TABLET}}" alt="Tablet summary"></div></div>
<div class="device phone"><div class="speaker"></div><div class="screen"><img src="{{MOBILE}}" alt="Mobile summary"></div><div class="home"></div></div>
<div class="caption mobile-label"><strong>Mobile</strong>390 × 844</div><div class="caption tablet-label"><strong>Tablet</strong>820 × 1180</div><div class="caption desktop-label"><strong>Desktop</strong>1440 × 960</div>
</html>
